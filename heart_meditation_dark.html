  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let isRunning = false;
      let totalSecondsLeft = 600; // 10 minutes (600s)
      let timerInterval = null;
      let breathInterval = null;
      let soundEnabled = true;

      // 4-4-4 Breathing State: 0 = Inhale (4s), 1 = Hold (4s), 2 = Exhale (4s)
      let breathState = 0; 
      let breathCount = 4;

      const timerDisplay = document.getElementById('timer-display');
      const progressBarFill = document.getElementById('progress-bar-fill');
      const phaseBadge = document.getElementById('phase-badge');

      const breathCircle = document.getElementById('breath-circle');
      const auraRing = document.getElementById('aura-ring');
      const breathActionText = document.getElementById('breath-action-text');
      const breathSubText = document.getElementById('breath-sub-text');
      const breathCountdown = document.getElementById('breath-countdown');

      const stageTitle = document.getElementById('stage-title');
      const stageDescription = document.getElementById('stage-description');
      const playIcon = document.getElementById('play-icon');

      function updateTimerDisplay() {
        const mins = Math.floor(totalSecondsLeft / 60);
        const secs = totalSecondsLeft % 60;
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        
        const progress = ((600 - totalSecondsLeft) / 600) * 100;
        progressBarFill.style.width = `${progress}%`;

        // Determine Stage
        const elapsed = 600 - totalSecondsLeft;
        if (elapsed < 180) {
          // Stage 1: 0 - 3 mins
          phaseBadge.textContent = '1단계: 불안의 파동 소멸 (3분)';
          stageTitle.textContent = '1단계: 불안의 파동 소멸 (3분)';
          stageDescription.textContent = '"척추를 똑바로 세우고 심장을 고요하게 유지하십시오. 4-4-4 호흡으로 내면의 모든 원망과 초조함의 진동을 소거합니다."';
        } else if (elapsed < 420) {
          // Stage 2: 3 - 7 mins (4 mins)
          phaseBadge.textContent = '2단계: 심장 주파수 공명 (4분)';
          stageTitle.textContent = '2단계: 심장 주파수 공명 (4분)';
          stageDescription.textContent = '"두 손을 포개어 가슴 중앙(심장 센터)에 얹으십시오. 심장의 온기가 전신으로 퍼져나가며 모든 자원이 완벽히 예비되었음을 느낍니다."';
        } else {
          // Stage 3: 7 - 10 mins (3 mins)
          phaseBadge.textContent = '3단계: 완료된 소망의 투사 (3분)';
          stageTitle.textContent = '3단계: 완료된 소망의 투사 (3분)';
          stageDescription.textContent = '"저널에 기록한 미래 성취들이 이미 현실이 되었음을 시각화하고 환희의 미소와 함께 우주 양자장에 기쁘게 투사하십시오."';
        }
      }

      function updateBreathCycle() {
        if (breathState === 0) {
          // Inhale (4s)
          breathActionText.textContent = '들숨 (Inhale)';
          breathSubText.textContent = '4초 동안 깊게 들이마십니다';
          breathCircle.style.transform = 'scale(1.25)';
          auraRing.style.transform = 'scale(1.3)';
          auraRing.style.opacity = '0.9';
          if (soundEnabled && breathCount === 4) playSingingBowlSound(432, 1.5);
        } else if (breathState === 1) {
          // Hold (4s)
          breathActionText.textContent = '멈춤 (Hold)';
          breathSubText.textContent = '4초 동안 고요히 숨을 멈춥니다';
          breathCircle.style.transform = 'scale(1.25)';
          auraRing.style.transform = 'scale(1.2)';
          auraRing.style.opacity = '0.7';
          if (soundEnabled && breathCount === 4) playSingingBowlSound(528, 1.5);
        } else {
          // Exhale (4s)
          breathActionText.textContent = '날숨 (Exhale)';
          breathSubText.textContent = '4초 동안 천천히 내쉬어 소거합니다';
          breathCircle.style.transform = 'scale(0.9)';
          auraRing.style.transform = 'scale(0.95)';
          auraRing.style.opacity = '0.4';
          if (soundEnabled && breathCount === 4) playSingingBowlSound(396, 1.5);
        }

        breathCountdown.textContent = breathCount;

        breathCount--;
        if (breathCount < 1) {
          breathCount = 4;
          breathState = (breathState + 1) % 3;
        }
      }

      function startTimer() {
        if (isRunning) return;
        isRunning = true;
        playIcon.textContent = 'pause';
        playSingingBowlSound(432, 3);
        showToast('🧘 심장 호흡 명상이 시작되었습니다.', 'self_improvement');

        timerInterval = setInterval(() => {
          if (totalSecondsLeft > 0) {
            totalSecondsLeft--;
            updateTimerDisplay();
          } else {
            completeMeditation();
          }
        }, 1000);

        breathInterval = setInterval(updateBreathCycle, 1000);
      }

      function pauseTimer() {
        if (!isRunning) return;
        isRunning = false;
        playIcon.textContent = 'play_arrow';
        clearInterval(timerInterval);
        clearInterval(breathInterval);
        showToast('명상이 일시 정지되었습니다.', 'pause');
      }

      function completeMeditation() {
        pauseTimer();
        QuantumStore.saveTodayJournal({ meditationCompleted: true });
        playSingingBowlSound(528, 4);
        showToast('🎉 10분 심장 호흡 명상 완주를 축하합니다! 양자장 동조가 완료되었습니다.', 'workspace_premium');

        setTimeout(() => {
          window.location.href = 'quantum_journal_dark.html';
        }, 2000);
      }

      document.getElementById('btn-play-pause').addEventListener('click', () => {
        if (isRunning) pauseTimer();
        else startTimer();
      });

      document.getElementById('btn-reset-timer').addEventListener('click', () => {
        pauseTimer();
        totalSecondsLeft = 600;
        breathState = 0;
        breathCount = 4;
        updateTimerDisplay();
        breathActionText.textContent = '들숨 (Inhale)';
        breathCountdown.textContent = '4';
        breathCircle.style.transform = 'scale(1)';
        showToast('명상 타이머가 초기화되었습니다.', 'replay');
      });

      document.getElementById('btn-sound-toggle').addEventListener('click', (e) => {
        soundEnabled = !soundEnabled;
        const icon = e.currentTarget.querySelector('span');
        icon.textContent = soundEnabled ? 'volume_up' : 'volume_off';
        showToast(soundEnabled ? '사운드가 켜졌습니다.' : '사운드가 켜짐/음소거 되었습니다.', soundEnabled ? 'volume_up' : 'volume_off');
      });

      updateTimerDisplay();
    });
  </script>
